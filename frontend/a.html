<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Backend IoT</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #222; color: #0f0; }
        button { padding: 10px 20px; cursor: pointer; font-weight: bold; margin: 5px; }
        .log { border: 1px solid #444; padding: 10px; height: 300px; overflow-y: scroll; background: #000; margin-top: 10px;}
        .group { border: 1px solid #555; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🕵️ Backend Tester (No React needed)</h1>
    <h3 id="status" style="color:red">🔴 Disconnected</h3>

    <div class="group">
        <h3>1. Test Báo Thức (Alarm)</h3>
        <input type="time" id="alarmInput" style="padding: 5px;">
        <button onclick="setAlarm()">Gửi Báo Thức (Set Alarm)</button>
        <p><i>Mẹo: Chọn giờ hiện tại + 1 phút rồi chờ xem log.</i></p>
    </div>

    <div class="group">
        <h3>2. Test Pomodoro</h3>
        <button onclick="finishPomo()" style="background: tomato; color: white">Hoàn thành Pomodoro</button>
        <p><i>(Sẽ gửi sự kiện xong 25 phút về Server)</i></p>
    </div>

    <div class="group">
        <h3>3. Realtime Logs (Socket)</h3>
        <div id="logs" class="log"></div>
    </div>

    <script>
        // Kết nối đến Server Backend
        const socket = io("http://localhost:5001");
        const logDiv = document.getElementById("logs");

        function log(msg, color="#0f0") {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        socket.on("connect", () => {
            document.getElementById("status").innerText = "🟢 Connected to Server";
            document.getElementById("status").style.color = "#0f0";
            log("✅ Đã kết nối Socket!");
        });

        socket.on("disconnect", () => log("❌ Mất kết nối!", "red"));

        // 1. Nhận dữ liệu cảm biến (Test MQTT -> Server -> Web)
        socket.on("sensor_update", (data) => {
            log(`📡 Sensor Data: Temp=${data.temp}, Lux=${data.lux}`, "#aaa");
        });

        // 2. Nhận thông báo Báo thức cập nhật
        socket.on("alarm_updated", (data) => {
            log(`💾 Server xác nhận Báo thức: ${data.time} (Active: ${data.active})`, "cyan");
        });

        // 3. Nhận lệnh HÚ CÒI (Khi đến giờ báo thức)
        socket.on("alarm_triggered", (data) => {
            log(`🔔🔔🔔 RENG RENG!!! Báo thức lúc: ${data.time}`, "yellow");
            alert("⏰ DẬY ĐI ÔNG CHÁU ƠI!");
        });

        // --- Gửi lệnh đi ---
        function setAlarm() {
            const time = document.getElementById("alarmInput").value;
            if(time) {
                socket.emit("set_alarm", time);
                log(`📤 Đã gửi yêu cầu đặt báo thức: ${time}`);
            } else alert("Chưa chọn giờ!");
        }

        function finishPomo() {
            socket.emit("pomodoro_finished", 25);
            log(`📤 Đã gửi: Xong 1 Pomodoro (25p)`);
        }
    </script>
</body>
</html>
